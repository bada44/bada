name: Build

# Her main'e gonderimde Windows kurulum dosyasi (.exe) ve Android APK uretir.
# "v1.4.0" gibi bir etiket (tag) gonderirsen ikisi de GitHub "Releases" sayfasina otomatik yuklenir.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # release olusturmak icin

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: RetroHub-Windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Android SDK paketleri
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android projesini olustur
        working-directory: mobile
        run: |
          npm install
          node scripts/build-www.js
          npx cap add android
          node scripts/setup-android.js
          npx cap sync android
      - name: APK derle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK'yi adlandir
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk RetroHub-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RetroHub-Android
          path: RetroHub-Android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
